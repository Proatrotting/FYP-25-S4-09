    ports:
      - "8110:3000"
    volumes:
      - storage_node_11_data:/data

  storage_node_12:
    <<: *storage-node-template
    container_name: storage_node_12
    environment:
      <<: *common-environment
      NODE_HOSTNAME: storage_node_12
      STORAGE_PATH: /data/storage_node_12
    ports:
      - "8111:3000"
    volumes:
      - storage_node_12_data:/data

  # Test Infrastructure
  test_postgres_db:
    image: postgres:15
    container_name: test_postgres_db
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_fyp
    ports:
      - "5432:5432"
    volumes:
      - test_postgres_data:/var/lib/postgresql/data
    networks:
      - public_network
    profiles:
      - test

networks:
  # Public network - accessible from outside
  public_network:
    driver: bridge
  storage_internal:
    driver: bridge

