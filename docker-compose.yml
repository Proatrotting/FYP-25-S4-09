# version: '3.8'

# YAML anchors for common configurations
x-common-environment: &common-environment
  MASTER_NODE_HOST: master_node
  MASTER_NODE_PORT: 3000
  NODE_ROLE: STORAGE
  HEARTBEAT_INTERVAL: 30000

x-storage-node: &storage-node-template
  build:
    context: ./storage-node
    dockerfile: Dockerfile
  networks:
    - storage_internal
  depends_on:
    master_node:
      condition: service_healthy

services:
  # Core Infrastructure
  postgres_db:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: database
      POSTGRES_SHARED_BUFFERS: 256MB
      POSTGRES_MAX_CONNECTIONS: 100
      POSTGRES_EFFECTIVE_CACHE_SIZE: 1GB
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Database/Database.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - public_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d database"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      postgres 
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200

  master_node:
    build:
      context: ./master-node
      dockerfile: Dockerfile
    container_name: master_node
    environment:
      NODE_ROLE: MASTER
      NODE_HOSTNAME: master_node
      NODE_PORT: 3000
      HEARTBEAT_INTERVAL: 30000
      STORAGE_PATH: /data/master_node
      POSTGRES_HOST: postgres_db
      POSTGRES_PORT: 5432
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: database
      DATABASE_URL: postgresql://user:password@postgres_db:5432/database
      POSTGRES_MAX_CONNECTIONS: 25
      POSTGRES_MIN_CONNECTIONS: 5
    ports:
      - "8001:3000"
    volumes:
      - master_node_data:/data
    networks:
      - public_network
      - storage_internal
    depends_on:
      postgres_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # FastAPI Application
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app
    environment:
      DATABASE_URL: postgresql://user:password@postgres_db:5432/database
      MASTER_NODE_URL: http://master_node:3000
      FASTAPI_INTERNAL_URL: http://app:8000
      SECRET_KEY: your-secret-key-here
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 180
      SMTP_EMAIL: shard6442@gmail.com
      SMTP_PASSWORD: ialghugtojmoppby
      PYTHONUNBUFFERED: "1"  # Ensure Python output is not buffered
    ports:
      - "8004:8000"
    volumes:
      - ./app:/workspace/app
      - ./.env:/workspace/.env
    networks:
      - public_network
      - storage_internal
    depends_on:
      master_node:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # Repair Worker
  repair-worker:
    image: fyp-25-s4-09-fastapi
    container_name: repair_worker
    working_dir: /workspace
    command: python app/repair_worker.py
    environment:
      MASTER_NODE_URL: http://master_node:3000
      REPAIR_INTERVAL: 60
      MAX_CONCURRENT_REPAIRS: 3
      WORKER_ID: repair-worker-1
      POSTGRES_HOST: postgres_db
      POSTGRES_PORT: 5432
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: database
    volumes:
      - ./app:/workspace/app
    networks:
      - public_network
      - storage_internal
    depends_on:
      postgres_db:
        condition: service_healthy
      master_node:
        condition: service_healthy
    restart: unless-stopped

  # Heartbeat Monitor
  heartbeat-monitor:
    image: fyp-25-s4-09-fastapi
    container_name: heartbeat_monitor
    working_dir: /workspace
    command: python app/heartbeat_monitor.py
    environment:
      MASTER_NODE_URL: http://master_node:3000
      HEARTBEAT_CHECK_INTERVAL: 30
      HEARTBEAT_TIMEOUT: 45
      MONITOR_ID: heartbeat-monitor-1
      POSTGRES_HOST: postgres_db
      POSTGRES_PORT: 5432
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: database
    volumes:
      - ./app:/workspace/app
    networks:
      - public_network
      - storage_internal
    depends_on:
      postgres_db:
        condition: service_healthy
      master_node:
        condition: service_healthy
    restart: unless-stopped

  # Active Repair Service
  active-repair-service:
    image: fyp-25-s4-09-fastapi
    container_name: active_repair_service
    working_dir: /workspace
    command: python app/active_repair_service.py
    environment:
      ACTIVE_REPAIR_INTERVAL: 300  # Scan every 5 minutes (300 seconds)
      MAX_REPAIR_JOBS_PER_SCAN: 50  # Limit jobs created per scan
      ACTIVE_REPAIR_SERVICE_ID: active-repair-service-1
      MASTER_NODE_URL: http://master_node:3000
      POSTGRES_HOST: postgres_db
      POSTGRES_PORT: 5432
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: database
    volumes:
      - ./app:/workspace/app
    networks:
      - public_network
      - storage_internal
    depends_on:
      postgres_db:
        condition: service_healthy
      master_node:
        condition: service_healthy
    restart: unless-stopped

  # Storage Nodes (1-12: Distributed storage infrastructure)
  storage_node_1:
    <<: *storage-node-template
    container_name: storage_node_1
    environment:
      <<: *common-environment
      NODE_HOSTNAME: storage_node_1
      STORAGE_PATH: /data/storage_node_1
    ports:
      - "8100:3000"
    volumes:
      - storage_node_1_data:/data

  storage_node_2:
