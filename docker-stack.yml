version: '3.8'

services:
  # Master Node
  master_node:
    image: aiess/master-node:latest
    environment:
      NODE_ROLE: MASTER
      NODE_HOSTNAME: master_node
      NODE_PORT: 3000
      HEARTBEAT_INTERVAL: 30000
      STORAGE_PATH: /data/master_node
      DATABASE_URL: "postgresql://postgres:PZe|0muoOk1fVH/j@34.143.181.179:5432/fyp-storage?sslmode=require"
      POSTGRES_HOST: 34.143.181.179
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "PZe|0muoOk1fVH/j"
      POSTGRES_DB: fyp-storage
      POSTGRES_MAX_CONNECTIONS: 25
      POSTGRES_MIN_CONNECTIONS: 5
      POSTGRES_SSL: "true"
    ports:
      - "8000:3000"
    volumes:
      - master_node_data:/data
    networks:
      storage_network:
        aliases:
          - master_node
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5

  # FastAPI Application
  fastapi:
    image: aiess/fastapi-backend:latest
    environment:
      # Google Cloud SQL PostgreSQL Connection
      DATABASE_URL: "postgresql://postgres:PZe|0muoOk1fVH/j@34.143.181.179:5432/fyp-storage?sslmode=require"
      MASTER_NODE_URL: http://master_node:3000
      FASTAPI_INTERNAL_URL: http://fastapi:8000
      JWT_SECRET_KEY: your-secret-key-here-change-in-production-very-long-and-secure
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      ENVIRONMENT: production
      PYTHONUNBUFFERED: "1"
    ports:
      - "8004:8000"
    networks:
      - storage_network
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s

  # Storage Nodes (12 replicas distributed across worker nodes)
  storage_node:
    image: aiess/storage-node:latest
    environment:
      # Use manager's external IP instead of hostname for external workers
      MASTER_NODE_HOST: 34.126.113.75
      MASTER_NODE_PORT: 8000  # Use published port, not internal 3000
      NODE_ROLE: STORAGE
      HEARTBEAT_INTERVAL: 30000
      STORAGE_PATH: /data/storage
      # Use task slot number to generate unique IDs
      NODE_ID: "storage_node_{{.Task.Slot}}"
      # NODE_HOSTNAME will use container IP (from getContainerIP() function)
      # Templates don't work in network aliases, so we use overlay IPs instead
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
        mode: host
    volumes:
      - storage_data:/data
    networks:
      - storage_network
    deploy:
      replicas: 12
      placement:
        constraints:
          - node.role == worker
        max_replicas_per_node: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5

  # Repair Worker (with key share repair support)
  repair_worker:
    image: aiess/fastapi-backend:latest
    command: python app/repair_worker.py
    environment:
      DATABASE_URL: "postgresql://postgres:PZe|0muoOk1fVH/j@34.143.181.179:5432/fyp-storage?sslmode=require"
      MASTER_NODE_URL: http://master_node:3000
      REPAIR_INTERVAL: 60
      MAX_CONCURRENT_REPAIRS: 3
      WORKER_ID: repair-worker-1
      POSTGRES_HOST: 34.143.181.179
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "PZe|0muoOk1fVH/j"
      POSTGRES_DB: fyp-storage
    networks:
      - storage_network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5

  # Heartbeat Monitor
  heartbeat_monitor:
    image: aiess/fastapi-backend:latest
    command: python app/heartbeat_monitor.py
    environment:
      DATABASE_URL: "postgresql://postgres:PZe|0muoOk1fVH/j@34.143.181.179:5432/fyp-storage?sslmode=require"
      MASTER_NODE_URL: http://master_node:3000
      HEARTBEAT_CHECK_INTERVAL: 30
      HEARTBEAT_TIMEOUT: 45
      MONITOR_ID: heartbeat-monitor-1
      POSTGRES_HOST: 34.143.181.179
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "PZe|0muoOk1fVH/j"
      POSTGRES_DB: fyp-storage
    networks:
      - storage_network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5

  # Active Repair Service
  active_repair_service:
    image: aiess/fastapi-backend:latest
    command: python app/active_repair_service.py
    environment:
      DATABASE_URL: "postgresql://postgres:PZe|0muoOk1fVH/j@34.143.181.179:5432/fyp-storage?sslmode=require"
      ACTIVE_REPAIR_INTERVAL: 300  # Scan every 5 minutes
      MAX_REPAIR_JOBS_PER_SCAN: 50
      ACTIVE_REPAIR_SERVICE_ID: active-repair-service-1
      MASTER_NODE_URL: http://master_node:3000
      POSTGRES_HOST: 34.143.181.179
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "PZe|0muoOk1fVH/j"
      POSTGRES_DB: fyp-storage
    networks:
      - storage_network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5

networks:
  storage_network:
    driver: overlay
    attachable: true
    driver_opts:
      com.docker.network.driver.mtu: "1400"

volumes:
  master_node_data:
  storage_data: